name: 打包应用

# 触发方式：
#   · 推送到 master：打包 macOS（Apple 芯片）和 Windows 安装包，在本次运行的 Artifacts 里下载
#     如果 tauri.conf.json 里的版本号还没有发布过，会自动发布 Release（想发新版：把版本号改大再推送）
#   · 推送 v 开头的标签（如 git tag v0.2.0 && git push origin v0.2.0）：打包并发布 Release
#   · Actions 页面手动点 Run workflow：填写版本号就发布，留空只打包
on:
  workflow_dispatch:
    inputs:
      version:
        description: "发布版本号（如 0.2.0），留空只打包不发布"
        required: false
        default: ""
  push:
    branches: [master, main, claude/fervent-mendel-73thpy]
    tags: ["v*"]
  pull_request:

permissions:
  contents: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - name: 确定是否发布 Release
        id: v
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          V=""
          if [ -n "$INPUT_VERSION" ]; then
            V="$INPUT_VERSION"
          elif [ "$GITHUB_REF_TYPE" = "tag" ] && [[ "$GITHUB_REF_NAME" == v* ]]; then
            V="$GITHUB_REF_NAME"
          elif [ "$GITHUB_EVENT_NAME" = "push" ]; then
            CUR="$(node -p 'require("./src-tauri/tauri.conf.json").version')"
            if [ -z "$(git ls-remote --tags origin "refs/tags/v$CUR")" ]; then V="$CUR"; fi
          fi
          V="${V#v}"
          echo "version=$V" >> "$GITHUB_OUTPUT"
          if [ -n "$V" ]; then echo "本次会发布 v$V"; else echo "本次只打包，不发布"; fi

  build:
    needs: prepare
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS
            os: macos-latest
            target: aarch64-apple-darwin
            bundles: app,dmg
          - name: Windows
            os: windows-latest
            target: x86_64-pc-windows-msvc
            bundles: nsis
    name: 打包 ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    env:
      RELEASE_VERSION: ${{ needs.prepare.outputs.version }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: "./src-tauri -> target"
          key: ${{ matrix.target }}

      - name: 安装前端依赖
        run: npm ci

      - name: 运行核心测试
        working-directory: src-tauri
        run: cargo test -p ankiki-core

      - name: 版本号写入应用
        if: env.RELEASE_VERSION != ''
        run: |
          node -e '
            const fs = require("fs"), v = process.argv[1];
            for (const f of ["package.json", "src-tauri/tauri.conf.json"]) {
              const j = JSON.parse(fs.readFileSync(f, "utf8"));
              j.version = v;
              fs.writeFileSync(f, JSON.stringify(j, null, 2) + "\n");
            }' "$RELEASE_VERSION"

      - name: 打包
        run: npx tauri build --target ${{ matrix.target }} --bundles ${{ matrix.bundles }}

      - name: 整理安装包
        id: pkg
        run: |
          VERSION="$(node -p 'require("./src-tauri/tauri.conf.json").version')"
          BUNDLE="src-tauri/target/${{ matrix.target }}/release/bundle"
          mkdir -p release
          if [ "${{ matrix.name }}" = "macOS" ]; then
            SRC="$(ls "$BUNDLE"/dmg/*.dmg | head -1)"
            OUT="release/Ankiki_${VERSION}_macOS_arm64.dmg"
          else
            SRC="$(ls "$BUNDLE"/nsis/*-setup.exe | head -1)"
            OUT="release/Ankiki_${VERSION}_Windows_x64-setup.exe"
          fi
          cp "$SRC" "$OUT"
          ls -la release
          echo "path=$OUT" >> "$GITHUB_OUTPUT"

      - name: 上传安装包
        uses: actions/upload-artifact@v4
        with:
          name: Ankiki-${{ matrix.name }}
          path: ${{ steps.pkg.outputs.path }}
          if-no-files-found: error

  release:
    needs: [prepare, build]
    if: needs.prepare.outputs.version != ''
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: release
          merge-multiple: true

      - name: 发布到 Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ needs.prepare.outputs.version }}
          target_commitish: ${{ github.sha }}
          files: release/*
          generate_release_notes: true
          body: |
            ## 下载
            - **macOS（Apple 芯片）**：`Ankiki_*_macOS_arm64.dmg`，打开后把 Ankiki 拖进「应用程序」。
            - **Windows 10 / 11**：`Ankiki_*_Windows_x64-setup.exe`，双击安装，不需要管理员权限。

            ## 第一次打开被拦截？
            应用没有购买商业签名证书，系统会提示一次：
            - **macOS**：「系统设置 → 隐私与安全性」底部点「仍要打开」，或终端执行 `xattr -cr /Applications/Ankiki.app`
            - **Windows**：SmartScreen 提示时点「更多信息」→「仍要运行」
