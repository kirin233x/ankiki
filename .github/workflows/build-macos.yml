name: 打包 macOS 应用

# 触发方式：
#   · 推送代码到主分支：自动打包，DMG 在本次运行的 Artifacts 里下载
#   · 推送 v 开头的标签（如 git tag v0.2.0 && git push origin v0.2.0）：
#     自动打包并发布到仓库的 Releases 页面，直接把链接发给别人即可
#   · 推送到主分支时，如果 tauri.conf.json 里的版本号还没有发布过，会自动发布 Release
#     （想发新版：把版本号改大再推送即可）
#   · Actions 页面手动点 Run workflow：填写版本号（如 0.2.0）就会发布 Release 并自动打标签，
#     留空则只打包不发布
on:
  workflow_dispatch:
    inputs:
      version:
        description: "发布版本号（如 0.2.0），留空只打包不发布"
        required: false
        default: ""
  push:
    branches: [main, master, claude/fervent-mendel-73thpy]
    tags: ["v*"]
  pull_request:

permissions:
  contents: write

concurrency:
  group: macos-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: 确定是否发布 Release
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          V=""
          if [ -n "$INPUT_VERSION" ]; then
            V="$INPUT_VERSION"
          elif [ "$GITHUB_REF_TYPE" = "tag" ] && [[ "$GITHUB_REF_NAME" == v* ]]; then
            V="$GITHUB_REF_NAME"
          elif [ "$GITHUB_EVENT_NAME" = "push" ]; then
            # 推送到分支时：tauri.conf.json 里的版本号还没有发布过，就自动发布
            CUR="$(node -p 'require("./src-tauri/tauri.conf.json").version')"
            if [ -z "$(git ls-remote --tags origin "refs/tags/v$CUR")" ]; then V="$CUR"; fi
          fi
          V="${V#v}"
          echo "RELEASE_VERSION=$V" >> "$GITHUB_ENV"
          [ -n "$V" ] && echo "本次会发布 v$V" || echo "本次只打包，不发布"

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: "./src-tauri -> target"

      - name: 安装前端依赖
        run: npm ci

      - name: 运行核心测试
        working-directory: src-tauri
        run: cargo test -p ankiki-core

      - name: 版本号写入应用
        if: env.RELEASE_VERSION != ''
        run: |
          VERSION="${RELEASE_VERSION#v}"
          echo "RELEASE_TAG=v$VERSION" >> "$GITHUB_ENV"
          node -e '
            const fs = require("fs"), v = process.argv[1];
            for (const f of ["package.json", "src-tauri/tauri.conf.json"]) {
              const j = JSON.parse(fs.readFileSync(f, "utf8"));
              j.version = v;
              fs.writeFileSync(f, JSON.stringify(j, null, 2) + "\n");
            }' "$VERSION"

      - name: 打包（Apple 芯片 arm64）
        run: npx tauri build --target aarch64-apple-darwin --bundles app,dmg

      - name: 整理安装包
        id: dmg
        run: |
          VERSION="$(node -p 'require("./src-tauri/tauri.conf.json").version')"
          mkdir -p release
          SRC="$(ls src-tauri/target/aarch64-apple-darwin/release/bundle/dmg/*.dmg | head -1)"
          OUT="release/Ankiki_${VERSION}_arm64.dmg"
          cp "$SRC" "$OUT"
          echo "path=$OUT" >> "$GITHUB_OUTPUT"

      - name: 上传安装包
        uses: actions/upload-artifact@v4
        with:
          name: Ankiki-macOS
          path: ${{ steps.dmg.outputs.path }}
          if-no-files-found: error

      - name: 发布到 Releases
        if: env.RELEASE_VERSION != ''
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          target_commitish: ${{ github.sha }}
          files: ${{ steps.dmg.outputs.path }}
          generate_release_notes: true
          body: |
            ## 安装
            1. 下载下面的 `Ankiki_*_arm64.dmg`（适用于 M 系列 Apple 芯片的 Mac），打开后把 Ankiki 拖进「应用程序」。
            2. 第一次打开时如果提示「无法验证开发者」或「已损坏」：
               - 打开「系统设置 → 隐私与安全性」，在底部找到 Ankiki，点「仍要打开」；
               - 或者在终端执行：`xattr -cr /Applications/Ankiki.app`
