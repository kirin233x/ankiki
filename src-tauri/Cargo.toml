[workspace]
members = [".", "core"]

[package]
name = "ankiki"
version = "0.1.0"
description = "Ankiki - 轻量、精美的背单词应用"
authors = ["kirin233x"]
edition = "2021"

[lib]
name = "ankiki_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
ankiki-core = { path = "core" }
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = ["protocol-asset"] }
tauri-plugin-dialog = "2"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
