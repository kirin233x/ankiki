[package]
name = "ankiki-core"
version = "0.1.0"
edition = "2021"
description = "Ankiki 核心：数据库、FSRS 调度与 Anki 词书导入"

[dependencies]
anyhow = "1"
chrono = "0.4"
rand = "0.8"
rusqlite = { version = "0.32", features = ["bundled", "collation"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
zip = { version = "2", default-features = false, features = ["deflate"] }
zstd = "0.13"

[dev-dependencies]
tempfile = "3"
